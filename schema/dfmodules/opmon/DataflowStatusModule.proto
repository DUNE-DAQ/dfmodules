syntax = "proto3";

package dunedaq.dfmodules.opmon;


// regular metric published byt the DataflowStateModule
message DataflowStatusInfo {

  // counters
  uint64 decisions_received = 1;
  uint64 trb_completions_received = 2;
  uint64 tokens_received = 3;
  uint64 requests_received = 4;
  uint64 status_messages_sent = 5;
  uint64 decisions_sent = 6;

  uint64 trigger_decisions_completed = 7;

  // Time counters
  uint64 total_time_since_assignment = 10;
  int64 min_time_since_assignment = 11;
  int64 max_time_since_assignment = 12;

  uint64 pending_trigger_decision_time = 13; // Time in microseconds between receiving TDs and processing them
  uint64 pending_trb_completion_time = 14; // Time in microseconds between receiving TRBCs and processing them
  uint64 pending_token_time = 15; // Time in microseconds between receiving TDTs and processing them

  uint64 total_completion_time = 16;
  uint64 min_completion_time = 17;
  uint64 max_completion_time = 18;

  // guages
  bool   is_busy = 20;
  uint64 slots_building = 21;
  uint64 slots_writing = 22;
  uint64 slots_free = 23;

  // errors
  uint64 duplicate_decisions_received = 30;
  uint64 pending_trb_completion_timeouts = 31;
  uint64 pending_trigger_decision_token_timeouts = 32;

}
