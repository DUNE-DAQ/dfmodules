syntax = "proto3";

package dunedaq.dfmodules.opmon;


// regular metric published byt the DFO Broker Module
message DFOBrokerInfo {

  // counters 
  uint64 heartbeats_sent = 1;
  uint64 decisions_received = 2;
  uint64 decisions_sent = 3;
  uint64 tokens_received = 4;

  uint64 pending_trs = 5;

  string active_dfo = 6;
}
