syntax = "proto3";

package dunedaq.dfmodules.opmon;


// regular metric published byt the DFO
message DFOInfo {
  // status metrics
  uint64 pending_trigger_decisions = 1; // Present number of TriggerDecisions being worked on by the dataflow
  uint64 max_pending_trigger_decisions = 2; // Maximum number of TriggerDecisions being worked on during the collection interval
  uint64 reallocated_trigger_decisions = 3; // Number of TriggerDecisions that have been reallocated to a different Dataflow app

  // counters
  uint64 statuses_received = 20; // Number of Dataflow apps that reported in this interval
  uint64 decisions_received = 21;
  uint64 decisions_sent = 22;
  uint64 decisions_completed = 23;

  // time management of the decision thread
  uint64 waiting_for_decision = 30 ; // Time spent waiting on Trigger Decisions, in microseconds
  uint64 deciding_destination = 31 ; // Time spent making a decision on the receving DF app, in microseconds
  uint64 forwarding_decision = 32  ; // Time spent sending the Trigger Decision to TRBs, in microseconds
  uint64 request_send_time = 33; // Time spent sending DataflowStatusRequests, in microseconds
  uint64 request_response_wait = 34; // Time spent waiting on DataflowStatusModules to reply with requested status, in microseconds
  uint64 total_td_time = 35; // Total time spent building TDs (sum over all TDs), in microseconds
}


// these counters are published separately for each trigger type
message TriggerInfo {

  uint64 received = 1;
  uint64 completed = 2;
}